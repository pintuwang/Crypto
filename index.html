<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Price App with ±5% Zones</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; }
    .price { font-size: 1.5em; margin: 10px; }
    .chart-container {
        width: 300px;
        height: 150px;
        display: inline-block;
        border: 1px solid #ddd;
        padding: 10px;
        margin: 10px;
        border-radius: 10px;
        background: #f9f9f9;
    }
    .currency-toggle { margin-top: 20px; }
    .loading { font-size: 0.9em; color: #777; }
    .error { color: red; font-size: 0.9em; margin: 5px; }
    .status { font-size: 0.8em; color: #666; margin-top: 5px; }
</style>
</head>
<body>

<h1>Real-Time BTC and XRP Prices with ±5% Zones/24 Hours</h1>

<div id="btc-info">
    <div id="btc-price" class="price">BTC Price: Loading...</div>
    <div id="btc-error" class="error"></div>
    <div class="chart-container"><canvas id="btc-chart"></canvas></div>
</div>

<div id="xrp-info">
    <div id="xrp-price" class="price">XRP Price: Loading...</div>
    <div id="xrp-error" class="error"></div>
    <div class="chart-container"><canvas id="xrp-chart"></canvas></div>
</div>

<div class="currency-toggle">
    <button id="toggle-btn" onclick="toggleCurrency()">Switch to SGD</button>
    <div id="loading-indicator" class="loading" style="display: none;">Updating...</div>
</div>

<div id="status" class="status">Last updated: Never</div>

<script>
    // ── Config ────────────────────────────────────────────────────────────────
    // API keys are NEVER stored here.
    // fetch_prices.py (run by GitHub Actions using the COINGECKO_API_KEY secret)
    // writes data/prices.json; this page reads from that file.
    // If the cached file is unavailable it falls back to the free public endpoint.
    const CACHE_URL    = './data/prices.json';
    const PUBLIC_BASE  = 'https://api.coingecko.com/api/v3';
    const POLL_MS      = 30000;   // 30 s — re-reads the cached file
    const CHART_MS     = 300000;  // 5 min — refreshes chart data

    // ── State ─────────────────────────────────────────────────────────────────
    let currency = 'usd';
    let btcChart, xrpChart;
    let priceInterval, chartInterval;
    let retryCount = 0;
    const MAX_RETRIES = 3;

    const toggleBtn        = document.getElementById('toggle-btn');
    const loadingIndicator = document.getElementById('loading-indicator');
    const statusDiv        = document.getElementById('status');

    // ── Helpers ───────────────────────────────────────────────────────────────
    async function fetchWithTimeout(url, timeout = 8000) {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), timeout);
        try {
            const resp = await fetch(url, { signal: controller.signal });
            clearTimeout(tid);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.json();
        } catch (err) {
            clearTimeout(tid);
            throw err.name === 'AbortError' ? new Error('Request timed out') : err;
        }
    }

    function setError(msg) {
        document.getElementById('btc-error').textContent = msg;
        document.getElementById('xrp-error').textContent = msg;
    }

    function clearErrors() {
        document.getElementById('btc-error').textContent = '';
        document.getElementById('xrp-error').textContent = '';
    }

    // ── Primary path: read from data/prices.json (populated by GitHub Actions) ─
    async function fetchFromCache() {
        const cb   = '?v=' + Date.now();   // cache-bust so GitHub Pages serves fresh file
        const data = await fetchWithTimeout(CACHE_URL + cb);

        const btcPrice = data.prices?.bitcoin?.[currency];
        const xrpPrice = data.prices?.ripple?.[currency];
        if (btcPrice == null || xrpPrice == null) throw new Error('Incomplete cache data');

        document.getElementById('btc-price').textContent =
            `BTC Price: ${btcPrice.toLocaleString()} ${currency.toUpperCase()}`;
        document.getElementById('xrp-price').textContent =
            `XRP Price: ${xrpPrice.toLocaleString()} ${currency.toUpperCase()}`;

        updateLatestPrice(btcChart, btcPrice);
        updateLatestPrice(xrpChart, xrpPrice);

        statusDiv.textContent = `Last updated: ${new Date().toLocaleTimeString()} (cached ${data.last_update ?? ''})`;
        return data;
    }

    // ── Fallback path: call CoinGecko free public endpoint directly ───────────
    async function fetchFromPublicAPI() {
        const url  = `${PUBLIC_BASE}/simple/price?ids=bitcoin,ripple&vs_currencies=usd,sgd`;
        const data = await fetchWithTimeout(url);

        if (!data.bitcoin || !data.ripple) throw new Error('Invalid API response');

        const btcPrice = data.bitcoin[currency];
        const xrpPrice = data.ripple[currency];

        document.getElementById('btc-price').textContent =
            `BTC Price: ${btcPrice.toLocaleString()} ${currency.toUpperCase()}`;
        document.getElementById('xrp-price').textContent =
            `XRP Price: ${xrpPrice.toLocaleString()} ${currency.toUpperCase()}`;

        updateLatestPrice(btcChart, btcPrice);
        updateLatestPrice(xrpChart, xrpPrice);

        statusDiv.textContent = `Last updated: ${new Date().toLocaleTimeString()} (live)`;
    }

    // ── Price refresh (cache-first, public API fallback) ──────────────────────
    async function fetchPrices() {
        toggleBtn.disabled = true;
        loadingIndicator.style.display = 'block';
        clearErrors();
        try {
            await fetchFromCache();
            retryCount = 0;
        } catch {
            try {
                await fetchFromPublicAPI();
                retryCount = 0;
            } catch (err) {
                const msg = err.message === 'Request timed out'
                    ? 'API request timed out. Retrying...'
                    : 'Error fetching prices. Retrying...';
                setError(msg);
                retryCount++;
                if (retryCount <= MAX_RETRIES) {
                    setTimeout(fetchPrices, 2000 * retryCount);
                }
            }
        } finally {
            toggleBtn.disabled = false;
            loadingIndicator.style.display = 'none';
        }
    }

    // ── Chart data (cache-first, public API fallback) ─────────────────────────
    async function fetchChartData() {
        toggleBtn.disabled = true;
        loadingIndicator.style.display = 'block';
        try {
            // Try cached chart data first
            const cb   = '?v=' + Date.now();
            const data = await fetchWithTimeout(CACHE_URL + cb);
            const btcPrices = (data.charts?.bitcoin ?? []).map(p => p[1]);
            const xrpPrices = (data.charts?.ripple  ?? []).map(p => p[1]);

            if (btcPrices.length && xrpPrices.length) {
                updateChart(btcChart, btcPrices, btcPrices[0]);
                updateChart(xrpChart, xrpPrices, xrpPrices[0]);
                return;
            }
            throw new Error('No chart data in cache');
        } catch {
            // Fall back to public API for chart data
            try {
                const btcUrl = `${PUBLIC_BASE}/coins/bitcoin/market_chart?vs_currency=${currency}&days=1`;
                const xrpUrl = `${PUBLIC_BASE}/coins/ripple/market_chart?vs_currency=${currency}&days=1`;
                const [btcResp, xrpResp] = await Promise.all([
                    fetchWithTimeout(btcUrl),
                    fetchWithTimeout(xrpUrl)
                ]);

                if (!btcResp.prices || !xrpResp.prices) throw new Error('Invalid chart data');

                const btcPrices = btcResp.prices.map(p => p[1]);
                const xrpPrices = xrpResp.prices.map(p => p[1]);
                updateChart(btcChart, btcPrices, btcPrices[0]);
                updateChart(xrpChart, xrpPrices, xrpPrices[0]);
            } catch (err) {
                setError('Error loading chart data');
                console.error(err);
            }
        } finally {
            toggleBtn.disabled = false;
            loadingIndicator.style.display = 'none';
        }
    }

    // ── Chart helpers ─────────────────────────────────────────────────────────
    function createChart(ctx) {
        return new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(24).fill(''),
                datasets: [
                    { label: 'Price', data: [], borderColor: '#007bff', borderWidth: 2, tension: 0.2, pointRadius: 0 },
                    { label: '+5%',  data: [], borderColor: 'rgba(0,200,0,0.2)',   borderWidth: 1, fill: { above: 'rgba(0,200,0,0.1)',   below: 'transparent' } },
                    { label: '-5%',  data: [], borderColor: 'rgba(200,0,0,0.2)',   borderWidth: 1, fill: { above: 'transparent',           below: 'rgba(200,0,0,0.1)' } }
                ]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { display: true, ticks: { callback: v => v.toLocaleString() } }
                }
            }
        });
    }

    function updateChart(chart, data, referencePrice) {
        const plus5  = referencePrice * 1.05;
        const minus5 = referencePrice * 0.95;
        chart.data.labels        = Array(data.length).fill('');
        chart.data.datasets[0].data = data;
        chart.data.datasets[1].data = Array(data.length).fill(plus5);
        chart.data.datasets[2].data = Array(data.length).fill(minus5);
        chart.update();
    }

    function updateLatestPrice(chart, latestPrice) {
        const len = chart.data.datasets[0].data.length;
        if (len > 0) {
            chart.data.datasets[0].data[len - 1] = latestPrice;
            chart.update();
        }
    }

    // ── Interval management ───────────────────────────────────────────────────
    function resetIntervals() {
        clearInterval(priceInterval);
        clearInterval(chartInterval);
        fetchPrices();
        fetchChartData();
        priceInterval = setInterval(fetchPrices,    POLL_MS);
        chartInterval = setInterval(fetchChartData, CHART_MS);
    }

    async function toggleCurrency() {
        currency = currency === 'usd' ? 'sgd' : 'usd';
        toggleBtn.textContent = `Switch to ${currency === 'usd' ? 'SGD' : 'USD'}`;
        await fetchPrices();
        await fetchChartData();
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    window.onload = () => {
        btcChart = createChart(document.getElementById('btc-chart').getContext('2d'));
        xrpChart = createChart(document.getElementById('xrp-chart').getContext('2d'));
        resetIntervals();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) resetIntervals(); });
        window.addEventListener('focus', resetIntervals);
    };
</script>

</body>
</html>
