name: Fetch Crypto Prices

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch prices
        env:
          # Store your CoinGecko Pro key in:
          #   GitHub → Settings → Secrets and variables → Actions → COINGECKO_API_KEY
          # Leave the secret unset to use the free public endpoint.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python fetch_prices.py

      - name: Commit updated prices
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "chore: update crypto prices [skip ci]"
          git push
